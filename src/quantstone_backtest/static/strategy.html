<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantStone · 策略</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/research.css"><script defer src="/app.js"></script>
</head>
<body class="strategy-page">
<header class="topbar"><a class="brand" href="/" id="brand-home"><span class="brand-mark">QS</span><span>QuantStone<small>BACKTEST</small></span></a></header>
<main><div id="notice" role="alert" hidden></div>
<section id="workbench-view" class="view">
  <nav class="strategy-breadcrumb" aria-label="页面路径"><a id="back-button" href="/">策略列表</a><span>/</span><span id="breadcrumb-strategy">策略</span></nav>
  <div class="workbench-heading">
    <div class="workbench-title"><div><span id="strategy-status-dot" class="status-dot"></span><h1 id="strategy-title">策略</h1></div><p id="strategy-description"></p><div id="strategy-instrument" class="instrument-badge"></div></div>
    <div class="workbench-actions"><span id="save-state">已保存</span><button id="save-strategy-button" class="secondary">保存策略</button><button id="config-button" class="secondary">回测配置</button><button id="run-button-top" class="primary">运行回测</button></div>
  </div>
  <div class="workbench-tabs"><button class="active" data-worktab="code">策略代码</button><button data-worktab="results">回测结果</button><button data-worktab="history">历史记录</button></div>
  <section id="code-pane" class="work-pane">
    <div class="workspace">
      <section class="strategy-panel panel">
        <label class="sr-only" for="strategy">Python 策略代码</label><textarea id="strategy" spellcheck="false" autocomplete="off"></textarea>
      </section>
    </div>
  </section>
  <dialog id="config-dialog" class="config-dialog">
      <section class="config-panel">
        <div class="drawer-heading"><div><h2>回测配置</h2><p>后一根 K 线开盘撮合</p></div><button id="config-close" class="icon-button" type="button" aria-label="关闭回测配置">×</button></div>
        <form id="run-form"><div class="form-grid">
          <label class="wide">回测名称<input id="name" maxlength="100" required></label>
          <label>运行频率<select id="frequency"><option value="1d">日线</option><option value="1m">1 分钟</option></select></label>
          <label class="wide">分钟数据时间标签<select id="minute_label"><option value="end">结束时间</option><option value="start">开始时间</option></select></label>
          <label>开始日期<input id="start" type="date" value="2026-11-02" required></label>
          <label>结束日期<input id="end" type="date" value="2026-11-13" required></label>
          <label>初始资金 / 元<input id="initial_cash" type="number" value="1000000" min="1" required></label>
        </div>
        <p class="hint">交易对象由策略决定；费用可在 init 中通过 ctx.set_fees(...) 设置。</p>
        <div class="run-actions"><button type="submit" id="run-button" class="primary">运行回测</button></div></form>
      </section>
  </dialog>
  <section id="results-pane" class="work-pane" hidden>
    <section class="panel results-panel"><div class="panel-heading"><div><span class="section-label">回测结果</span><small id="result-name">等待运行</small></div><span id="status" class="status">尚未开始</span></div><div class="progress-track"><progress id="progress" max="1" value="0"></progress></div>
      <div class="metrics"><div><span>累计收益</span><strong id="return-value">—</strong></div><div><span>最大回撤</span><strong id="drawdown-value">—</strong></div><div><span>账户总资产</span><strong id="equity-value">—</strong></div><div><span>成交笔数</span><strong id="trades-value">—</strong></div></div>
      <div id="chart" class="chart"><div class="empty"><strong>从一次回测开始</strong><p>运行策略后，在这里查看账户净值。</p></div></div>
      <p id="result-note" class="result-note"></p><div class="result-actions"><span id="progress-text" class="hint"></span><div><button id="cancel-button" class="secondary" hidden>取消任务</button><button id="export-button" class="secondary" disabled>导出结果</button></div></div>
    </section>
    <section class="panel details-panel"><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="positions">持仓</button><button role="tab" aria-selected="false" data-tab="orders">订单</button><button role="tab" aria-selected="false" data-tab="trades">成交</button><button role="tab" aria-selected="false" data-tab="logs">日志与错误</button></div><div id="detail-content" class="table-container" role="tabpanel"><p class="hint">运行回测后查看明细。</p></div></section>
  </section>
  <section id="history-pane" class="work-pane" hidden><section class="panel history-panel"><div class="panel-heading"><div><span class="section-label">该策略的回测历史</span><small>按创建时间倒序</small></div><button id="refresh-button" class="text-button">刷新</button></div><div id="history" class="table-container"></div></section></section>
</section>
</main></body></html>
