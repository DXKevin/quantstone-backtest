<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantStone · 策略研究</title><link rel="stylesheet" href="/styles.css?v=20261128-2"><link rel="stylesheet" href="/research.css?v=20261128-2"><script defer src="/app.js?v=20261128-2"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" id="brand-home"><span class="brand-mark">QS</span><span>QuantStone<small>BACKTEST</small></span></a>
  <nav><a class="active" href="#" id="workspace-home">研究工作区</a></nav>
  <div class="topbar-meta"><span class="system-dot"></span> 本地研究环境</div>
</header>
<div class="app-shell">
<aside class="sidebar" aria-label="研究导航">
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg>
  </button>
  <p class="nav-caption">WORKSPACE</p>
  <button class="side-item active" id="research-home"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>策略研究</button>
  <div class="side-bottom"><span>策略研究</span><small>v0.1</small></div>
</aside>
<main>
<div id="notice" role="alert" hidden></div>
<section id="strategy-view" class="view">
  <p class="breadcrumb">工作区 / 策略研究</p>
  <div class="page-heading"><div><h1>策略研究</h1><p class="subhead">从策略假设到历史验证，管理每一次研究。</p></div><button id="new-strategy-button" class="primary"><span>＋</span> 新建策略</button></div>
  <div class="research-tabs" aria-label="策略分类">
    <button data-scope="all" aria-pressed="true">全部策略 <span id="strategy-total">—</span></button>
    <button data-scope="running" aria-pressed="false">运行中 <span id="run-running">—</span></button>
    <button data-scope="archived" aria-pressed="false">已归档 <span id="strategy-archived">—</span></button>
    <span class="research-summary">启用 <span id="strategy-active">—</span> · 累计回测 <span id="run-total">—</span></span>
  </div>
  <section class="strategy-card">
    <div class="toolbar">
      <div class="search-box"><span>⌕</span><label class="sr-only" for="strategy-search">搜索策略</label><input id="strategy-search" type="search" placeholder="搜索策略名称、说明或标签"></div>
      <div class="filters"><label>品种<select id="instrument-filter"><option value="">全部品种</option><option value="stock">股票</option></select></label><label>市场<select id="market-filter"><option value="">全部市场</option><option>A股</option></select></label><label>频率<select id="frequency-filter"><option value="">全部频率</option><option>日线</option><option>分钟</option><option>日线 + 分钟</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option value="active">启用中</option><option value="archived">已归档</option></select></label></div>
    </div>
    <div class="strategy-table-wrap">
      <table class="strategy-table"><thead><tr><th>策略</th><th>品种 / 市场 / 频率</th><th>标签</th><th>最近回测</th><th>回测次数</th><th>最后修改</th></tr></thead><tbody id="strategy-list"></tbody></table>
      <div id="strategy-empty" class="empty-state" hidden><div>⌁</div><strong>没有找到策略</strong><p>调整筛选条件，或创建一个新策略。</p></div>
    </div>
  </section>
  <div class="list-footer"><span id="list-count"></span><span>按最后修改时间排序 · 回测状态来自真实任务</span></div>
</section>

</main>
</div>
<dialog id="strategy-dialog"><form id="strategy-form" method="dialog">
  <div class="dialog-heading"><div><p class="eyebrow">NEW RESEARCH</p><h2>新建策略</h2></div><button type="button" id="dialog-close" class="icon-button" aria-label="关闭">×</button></div>
  <p class="dialog-note">先建立策略档案，进入工作台后再编写代码和运行回测。</p>
  <label>策略名称<input id="new-name" maxlength="100" placeholder="例如：小市值动量策略" required></label>
  <label>策略目录<input id="new-folder" maxlength="120" value="默认目录" placeholder="例如：趋势策略/均线"></label>
  <label>策略说明<textarea id="new-description" maxlength="500" placeholder="记录策略假设、适用市场或研究目标"></textarea></label>
  <div class="dialog-grid"><label>品种<select id="new-instrument"><option value="stock">股票</option></select></label><label>市场<select id="new-market"><option>A股</option></select></label><label>研究频率<select id="new-frequency"><option>日线</option><option>分钟</option><option>日线 + 分钟</option></select></label></div>
  <label>标签<input id="new-tags" placeholder="动量, 多因子, 低波动"></label>
  <div class="dialog-actions"><button type="button" id="dialog-cancel" class="secondary">取消</button><button type="submit" class="primary">创建并进入</button></div>
</form></dialog>
</body></html>
