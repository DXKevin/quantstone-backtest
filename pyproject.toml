[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstone-backtest"
version = "0.1.0"
description = "A-share event-driven account backtesting workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
data = ["pyarrow>=18,<24"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
quantstone-backtest = "quantstone_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantstone_backtest = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
